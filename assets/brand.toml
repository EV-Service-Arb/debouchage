# Débouchage Rapide's single source for colour, in the `@evinvest/uikit` token
# vocabulary. The page is drawn in Figma `6LWuvlJoqYK4S8sdAZOIJ0` (Home Desktop
# 1440 7:174 / Mobile 390 11:524), whose variables carry these role names; the
# accent and chart roles the frame does not draw are filled from the same
# family (teal, petrol, yellow). `npm run palette` emits `app/brand.css` and
# fails on a hole in either scope; a test holds the committed copy to this file.

wordmark = ["Débouchage Rapide", ""]

[colors.light]
background = "#ffffff"
card = "#f5f7f7"
