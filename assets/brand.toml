# Débouchage Rapide's single source for colour, in the `@evinvest/uikit` token
# vocabulary. The page is drawn in Figma `6LWuvlJoqYK4S8sdAZOIJ0`, whose `Color`
# variables carry these role names; the accent and chart roles the frame does
# not draw are filled from the same family (petrol, green, amber). Rationale:
# docs/ARCHITECTURE.md « Colour ». `npm run palette` emits `app/brand.css` and
# fails on a hole in either scope; a test holds the committed copy to this file.

wordmark = ["Débouchage Rapide", ""]

[colors.light]
background = "#f5f3ee"
card = "#ffffff"
muted = "#eeebe3"
popover = "#ffffff"
hover = "#efece4"
ink = "#0a1f25"
ink-mid = "#3b5258"
ink-soft = "#5b6f74"
border = "#dcd8cb"
input = "#bdb8a8"
ring = "#1b4a55"
brand = "#0a1f25"
primary = "#f2a81d"
on-primary = "#0a1f25"
primary-ink = "#1b4a55"
secondary = "#0f2c34"
on-secondary = "#ffffff"
positive = "#1d7a5a"
on-positive = "#ffffff"
accent-trace = "#5b6f74"
on-accent-trace = "#ffffff"
accent-debug = "#5b6f74"
on-accent-debug = "#ffffff"
accent-info = "#1b4a55"
on-accent-info = "#ffffff"
accent-warn = "#f2a81d"
on-accent-warn = "#0a1f25"
accent-error = "#b83227"
on-accent-error = "#ffffff"
chart-1 = "#1b4a55"
chart-2 = "#1d7a5a"
chart-3 = "#f2a81d"
chart-4 = "#b83227"
chart-5 = "#0a1f25"
